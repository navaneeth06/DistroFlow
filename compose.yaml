
services:
  postgres:
    image: postgres:18
    container_name: distroflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: distroflow_dev
      POSTGRES_USER: distroflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - distroflow_pgdata:/var/lib/postgresql

  # Local email catcher: the API sends to localhost:1025; read the emails at http://localhost:8025.
  # It never delivers to real inboxes, so it is for development only.
  mailpit:
    image: axllent/mailpit:v1.33.1
    container_name: distroflow-mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"   # SMTP
      - "127.0.0.1:8025:8025"   # web UI

volumes:
  distroflow_pgdata:
